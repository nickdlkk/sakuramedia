name: 新功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先确认：

        1. **查过 [Wiki 常见问题](https://tinypinglite.github.io/sakuramedia/faq)** —— 大部分使用问题已有解答
        2. **搜过已有 Issue** —— 避免重复提交

        以上都确认过，请继续填写 👇

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已查阅 [Wiki 常见问题](https://tinypinglite.github.io/sakuramedia/faq)，没有找到解答
          required: true
        - label: 我已搜索过已有 Issue，没有重复
          required: true

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 想做什么、解决什么问题
      placeholder: |
        希望支持 XX 功能，用来解决 XX 问题
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么情况下需要这个功能
      placeholder: |
        例如：在 XX 页面做 XX 操作时需要 XX
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 具体期望的交互或结果
      placeholder: |
        例如：点击 XX 后应出现 XX，并可以 XX
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 如有截图、参考实现或其它信息，请贴在这里
    validations:
      required: false
